    <script>
        // Infrastructure Shield: Suppress noise from browser extensions (MetaMask, Wallet, etc.)
        (function() {
            const isExtensionNoise = (msg) => {
                if (!msg || typeof msg !== 'string') return false;
                const low = msg.toLowerCase();
                return low.includes('metamask') || low.includes('ethereum') || 
                       low.includes('web3') || low.includes('wallet') ||
                       (low.includes('failed to connect') && low.includes('extension'));
            };

            // Global Error Shield
            window.onerror = function(msg, url, line, col, error) {
                if (isExtensionNoise(msg)) return true;
                console.error('Core Error:', msg, { url, line, col, error });
                return false;
            };
            window.onunhandledrejection = function(e) {
                const msg = e.reason && (e.reason.message || e.reason);
                if (isExtensionNoise(msg)) { e.preventDefault(); return true; }
            };

            // Console Shield
            ['error', 'warn', 'info'].forEach(m => {
                const orig = console[m];
                console[m] = (...args) => {
                    const combined = args.map(a => {
                        try { return typeof a === 'string' ? a : JSON.stringify(a); } catch (e) { return String(a); }
                    }).join(' ');
                    if (isExtensionNoise(combined)) return;
                    orig.apply(console, args);
                };
            });

            // Mock Provider to preempt extension injection and stop connection errors
            if (!window.ethereum) {
                const silent = { request: () => Promise.resolve([]), on: () => {}, removeListener: () => {}, isMetaMask: false };
                try {
                    Object.defineProperty(window, 'ethereum', { value: silent, writable: false, configurable: false });
                } catch (e) { window.ethereum = silent; }
            }
        })();
    </script>

            const [val, setVal] = useState(0);

            useEffect(() => {
                let start = null;
                let reqId;

                const step = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    // Ease out cubic
                    const ease = 1 - Math.pow(1 - progress, 3);
                    const current = ease * end;
                    setVal(current);

                    if (progress < 1) {
                        reqId = requestAnimationFrame(step);
                    } else {
                        setVal(end);
                    }
                };

                reqId = requestAnimationFrame(step);
                return () => cancelAnimationFrame(reqId);
            }, [end, duration]);

            const displayValue = decimals > 0 ? val.toFixed(decimals) : Math.round(val);
            return html`<span>${prefix}${displayValue}${suffix}</span>`;

            useEffect(() => {
                if (!result) return;

                    const timer = setTimeout(() => {
                        const generated = generateAuditPDF({ result, businessName, businessDetails });
                        if (generated) {
                            setPdfData(generated);
                        }
                        setIsGeneratingPdf(false);
                    }, 60);
                    return () => clearTimeout(timer);

                    console.error("PDF generation failed:", err);
                    setIsGeneratingPdf(false);

                if (!isAccessGranted) {
                    onUnlockRequest('download');
                    return;

                try {
                    if (pdfData && pdfData.download) {
                        pdfData.download();
                    } else {
                        const generated = generateAuditPDF({ result, businessName, businessDetails });
                        if (generated) {
                            setPdfData(generated);
                            generated.download();

                    }
                    setDownloadSuccess(true);
                    setTimeout(() => setDownloadSuccess(false), 4000);

                    console.error("Failed to download PDF:", e);

                                <p className="text-[11px] text-gray-400">Used when non-subscribers click 'Save as PDF' or 'Email Summary'.</p>
                            </div>

                            <div className="md:col-span-2 flex justify-end">
                                <button 
                                    type="submit"
                                    className="px-6 py-3 bg-gray-900 hover:bg-black text-white rounded-xl text-sm font-bold shadow-md transition-all"
                                >
                                    Save PayPal Links
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Leads Table -->
                    ${history.length === 0 ? html`
                        <div className="py-20 text-center space-y-4">
                            <div className="inline-block p-6 bg-gray-50 rounded-[40px] text-gray-300">
                                <${SearchIcon} size=${64} />
                            </div>
                            <p className="text-gray-400 font-bold text-xl">No scan history found.</p>
                            <div className="pt-2">
                                <button 
                                    onClick=${onLogout}
                                    className="px-6 py-3 bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-700 rounded-2xl text-xs font-black transition-colors inline-flex items-center gap-2 border border-gray-200 shadow-sm"
                                >
                                    <${LogOutIcon} size=${16} /> Sign Out of Admin Account
                                </button>
                            </div>
                        </div>
                    ` : html`
                        <div className="space-y-4">
                            <h3 className="text-xl font-black text-gray-900">Submitted Leads</h3>
                            <div className="overflow-x-auto border border-gray-100 rounded-2xl">
                                <table className="w-full text-left">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest">Company</th>
                                            <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest">Score</th>
                                            <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest">Contact</th>
                                            <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest">Market</th>
                                            <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest whitespace-nowrap">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 bg-white">
                                        ${history.map((entry, idx) => html`
                                            <tr key=${idx} className="hover:bg-gray-50/70 transition-colors">
                                                <td className="px-6 py-6 font-bold text-gray-900">
                                                    <div className="flex flex-col">
                                                        <span>${entry.businessName}</span>
                                                        <span className="text-xs text-indigo-500 font-medium">${entry.website || 'No Website'}</span>
                                                    </div>
                                                </td>
                                                <td className="px-6 py-6 font-black">
                                                    <span className=${`px-3 py-1 rounded-full text-sm font-black ${entry.overallScore < 40 ? 'bg-red-50 text-red-600' : entry.overallScore < 75 ? 'bg-amber-50 text-amber-600' : 'bg-emerald-50 text-emerald-600'}`}>
                                                        ${entry.overallScore}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-6 text-gray-600">
                                                    <div className="flex flex-col">
                                                        <span className="font-bold whitespace-nowrap text-gray-900">${entry.email}</span>
                                                        <span className="text-xs text-gray-500">${entry.phoneNumber}</span>
                                                    </div>
                                                </td>
                                                <td className="px-6 py-6 text-gray-500">${entry.location}</td>
                                                <td className="px-6 py-6">
                                                    <button 
                                                        onClick=${() => onViewAudit(entry)}
                                                        className="text-red-600 font-black hover:underline whitespace-nowrap flex items-center gap-1"
                                                    >
                                                        View <${ExternalLinkIcon} size=${14} />
                                                    </button>
                                                </td>
                                            </tr>
                                        `)}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="flex flex-col sm:flex-row justify-between items-center gap-4 pt-6 border-t border-gray-100">
                            <div className="text-xs text-gray-400 font-semibold flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                                Admin Session: <span className="text-gray-700 font-bold">${adminEmail}</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick=${onLogout}
                                    className="px-5 py-2.5 bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-700 rounded-2xl text-xs font-black transition-colors flex items-center gap-2 border border-gray-200"
                                >
                                    <${LogOutIcon} size=${16} /> Sign Out
                                </button>
                                <button 
                                    onClick=${onClear}
                                    className="bg-red-50 text-red-600 px-6 py-2.5 rounded-2xl text-xs font-black hover:bg-red-100 transition-colors flex items-center gap-2"
                                >
                                    <${TrashIcon} size=${16} /> Purge Vault
                                </button>
                            </div>
                        </div>
                    `}
                </div>
            `;
        };

        // --- MAIN APP ---

        const ADMIN_EMAILS = [
            "customerservice.mme365@gmail.com",
            "marketingmanagementenp.365@gmail.com"
        ];

        const DEFAULT_PAYPAL_SUB = "https://www.paypal.com/cgi-bin/webscr?cmd=_xclick-subscriptions&business=customerservice.mme365@gmail.com&item_name=GBP+Auditor+Unlimited+Monthly+Pass&a3=19.00&p3=1&t3=M&src=1";
        const DEFAULT_PAYPAL_DOC = "https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=customerservice.mme365@gmail.com&item_name=GBP+Audit+Report+PDF&amount=2.00&currency_code=USD";
        const WEEKLY_FREE_LIMIT = 3;

        const App = () => {
            const [user, setUser] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [activeBusiness, setActiveBusiness] = useState('');
            const [activeBusinessDetails, setActiveBusinessDetails] = useState(null);
            const [history, setHistory] = useState([]);
            const [showAdmin, setShowAdmin] = useState(false);

            // Monetization & Subscription state
            const [isSubscriber, setIsSubscriber] = useState(false);
            const [unlockedAudits, setUnlockedAudits] = useState([]);
            const [showSubModal, setShowSubModal] = useState(false);
            const [showUnlockModal, setShowUnlockModal] = useState(false);

            const [paypalSubUrl, setPaypalSubUrl] = useState(() => {
                return localStorage.getItem('gbp_paypal_sub_url') || DEFAULT_PAYPAL_SUB;
            });
            const [paypalDocUrl, setPaypalDocUrl] = useState(() => {
                return localStorage.getItem('gbp_paypal_doc_url') || DEFAULT_PAYPAL_DOC;
            });

            const handleSavePaypalUrls = (sub, doc) => {
                const cleanSub = sub || DEFAULT_PAYPAL_SUB;
                const cleanDoc = doc || DEFAULT_PAYPAL_DOC;
                setPaypalSubUrl(cleanSub);
                setPaypalDocUrl(cleanDoc);
                localStorage.setItem('gbp_paypal_sub_url', cleanSub);
                localStorage.setItem('gbp_paypal_doc_url', cleanDoc);
            };

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setIsInitialLoading(false);
                });
                return unsubscribe;
            }, []);

            // Check if current user is an authorized admin
            const isAdmin = Boolean(user?.email && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(user.email.toLowerCase().trim()));

            // Load subscription & unlocked reports for logged in user
            useEffect(() => {
                if (!user) {
                    setIsSubscriber(false);
                    setUnlockedAudits([]);
                    return;
                }
                const subStatus = localStorage.getItem(`gbp_sub_${user.uid}`) === 'true';
                setIsSubscriber(subStatus);
                try {
                    const unlocked = JSON.parse(localStorage.getItem(`gbp_unlocked_${user.uid}`) || '[]');
                    setUnlockedAudits(unlocked);
                } catch (e) {
                    setUnlockedAudits([]);
                }
            }, [user]);

            const activateSubscription = () => {
                if (!user) return;
                setIsSubscriber(true);
                localStorage.setItem(`gbp_sub_${user.uid}`, 'true');
                setShowSubModal(false);
                setShowUnlockModal(false);
                alert("Unlimited Pro access activated! You now have unlimited audits and free PDF downloads.");
            };

            const unlockSingleReport = () => {
                if (!user || !activeBusiness) return;
                const updated = [...new Set([...unlockedAudits, activeBusiness])];
                setUnlockedAudits(updated);
                localStorage.setItem(`gbp_unlocked_${user.uid}`, JSON.stringify(updated));
                setShowUnlockModal(false);
                alert(`Report for "${activeBusiness}" is unlocked! You can now download the PDF and email the executive summary.`);
            };

            const login = async () => {
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                } catch (err) {
                    console.error("Login failed", err);
                }
            };

            const logout = () => {
                setShowAdmin(false);
                signOut(auth);
            };

            useEffect(() => {
                if (!user) return;
                
                const fetchHistory = async () => {
                    try {
                        let q;
                        if (isAdmin) {
                            // Authorized Admins see all leads
                            q = query(
                                collection(db, "leads"), 
                                orderBy("timestamp", "desc")
                            );
                        } else {
                            // Regular users see only their own
                            q = query(
                                collection(db, "leads"), 
                                where("userId", "==", user.uid),
                                orderBy("timestamp", "desc")
                            );
                        }
                        const snapshot = await getDocs(q);
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setHistory(data);
                    } catch (err) {
                        console.error("Failed to fetch history:", err);
                    }
                };
                fetchHistory();
            }, [user, isAdmin]);

            // Calculate audits conducted by this user in the past 7 days
            const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const auditsThisWeek = history.filter(h => h.timestamp && new Date(h.timestamp).getTime() >= weekAgo).length;

            const runAudit = async (data) => {
                let activeUser = user;

                // 1-Click Google Sign-in on audit generation if not yet authenticated
                if (!activeUser) {
                    try {
                        const provider = new GoogleAuthProvider();
                        const cred = await signInWithPopup(auth, provider);
                        activeUser = cred.user;
                        setUser(activeUser);
                    } catch (authErr) {
                        console.log("Google sign-in closed or aborted by user:", authErr);
                        return;
                    }
                }

                if (!activeUser) return;

                const userIsAdmin = Boolean(activeUser.email && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(activeUser.email.toLowerCase().trim()));
                const userIsSub = localStorage.getItem(`gbp_sub_${activeUser.uid}`) === 'true';

                // Enforce 3 audits per week for standard users
                if (!userIsAdmin && !userIsSub && auditsThisWeek >= WEEKLY_FREE_LIMIT) {
                    setShowSubModal(true);
                    return;
                }

                setIsLoading(true);
                setError(null);
                setResult(null);
                setActiveBusiness(data.businessName);
                setActiveBusinessDetails(data);

                try {
                    const response = await fetch(`${API_BASE}/api/audit`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            businessName: data.businessName,
                            location: data.location,
                            phoneNumber: data.phoneNumber
                        })
                    });

                    if (!response.ok) throw new Error("Audit generation failed");
                    const auditResult = await response.json();

                    // Save lead to Firestore with verified Google user tracking
                    const leadData = {
                        ...data,
                        email: data.email || activeUser.email || '',
                        userEmail: activeUser.email || '',
                        userDisplayName: activeUser.displayName || '',
                        userId: activeUser.uid,
                        overallScore: auditResult.overallScore,
                        auditBreakdown: auditResult.auditBreakdown,
                        recommendations: auditResult.recommendations,
                        timestamp: new Date().toISOString(),
                        serverTimestamp: serverTimestamp()
                    };
                    
                    await addDoc(collection(db, "leads"), leadData);

                    setResult(auditResult);
                    
                    // Refresh history locally
                    setHistory(prev => [leadData, ...prev]);

                } catch (err) {
                    console.error("Audit failed:", err);
                    setError("Failed to process audit. Check console.");
                } finally {
                    setIsLoading(false);
                }
            };

            const viewAudit = (lead) => {
                if (lead.auditBreakdown && lead.recommendations) {
                    setResult({
                        overallScore: lead.overallScore,
                        auditBreakdown: lead.auditBreakdown,
                        recommendations: lead.recommendations
                    });
                    setActiveBusiness(lead.businessName);
                    setActiveBusinessDetails(lead);
                    setShowAdmin(false);
                } else {
                    setResult({
                        overallScore: lead.overallScore,
                        auditBreakdown: [
                            { category: 'Historical Data', score: lead.overallScore, comment: 'This is an archived lead. Precision breakdown available in modern scans only.' }
                        ],
                        recommendations: [
                            { title: 'Data Migration', description: 'Contact your technical lead to migrate legacy reports to the new persistent format.' }
                        ]
                    });
                    setActiveBusiness(lead.businessName);
                    setActiveBusinessDetails(lead);
                    setShowAdmin(false);
                }
            };

            const clearHistory = async () => {
                if (!isAdmin) {
                    alert("Unauthorized access restricted to verified admins.");
                    return;
                }
                
                if (!confirm("Are you sure you want to permanently delete all leads? This action cannot be undone.")) return;
                
                setIsLoading(true);
                try {
                    const snapshot = await getDocs(collection(db, "leads"));
                    const batch = snapshot.docs.map(d => deleteDoc(doc(db, "leads", d.id)));
                    await Promise.all(batch);
                    setHistory([]);
                    alert("Vault purged successfully.");
                } catch (err) {
                    console.error("Purge failed:", err);
                    alert("Failed to purge vault. Check permissions.");
                } finally {
                    setIsLoading(false);
                }
            };

            if (isInitialLoading) return html`<${Loader} />`;

            return html`
                <div className="min-h-screen p-4 sm:p-8 md:p-12 relative overflow-hidden">
                    <div className="max-w-6xl mx-auto space-y-12 relative z-10">
                        
                        <header className="no-print flex justify-between items-start">
                            <div className="space-y-1">
                                <h1 className="text-4xl font-black text-gray-900 tracking-tighter">GBP Auditor <span className="text-red-600">Pro</span></h1>
                                <p className="text-gray-400 font-bold uppercase tracking-[0.2em] text-xs">AI-Driven Local SEO Intelligence</p>
                            </div>
                            <div className="flex items-center gap-3">
                                ${user ? html`
                                    <!-- User Status / Tier -->
                                    <div className="hidden sm:flex items-center gap-2 mr-2">
                                        ${isAdmin ? html`
                                            <span className="px-3 py-1.5 bg-red-50 border border-red-200 text-red-700 text-xs font-black rounded-xl flex items-center gap-1.5">
                                                <${ShieldCheckIcon} size=${14} /> Admin
                                            </span>
                                        ` : isSubscriber ? html`
                                            <span className="px-3 py-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-black rounded-xl flex items-center gap-1.5">
                                                <${CrownIcon} size=${14} className="text-emerald-600" /> Pro Member
                                            </span>
                                        ` : html`
                                            <button 
                                                onClick=${() => setShowSubModal(true)}
                                                className="px-3 py-1.5 bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 text-xs font-black rounded-xl flex items-center gap-1.5 transition-colors"
                                            >
                                                <${CrownIcon} size=${14} className="text-amber-600" /> ${auditsThisWeek}/${WEEKLY_FREE_LIMIT} Audits • Upgrade ($19/mo)
                                            </button>
                                        `}
                                    </div>

                                    <div className="flex items-center gap-1">
                                        <div className="hidden md:flex flex-col items-end mr-2">
                                            <span className="text-sm font-black text-gray-900">${user.displayName || user.email}</span>
                                            <button onClick=${logout} className="text-[10px] font-black text-red-600 uppercase tracking-widest hover:text-red-500">Sign Out</button>
                                        </div>
                                        <button 
                                            onClick=${logout}
                                            title="Sign Out"
                                            className="md:hidden p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-colors"
                                        >
                                            <${LogOutIcon} size=${18} />
                                        </button>
                                    </div>
                                ` : html`
                                    <button 
                                        onClick=${login}
                                        className="px-4 py-2 bg-white hover:bg-gray-50 border border-gray-200 hover:border-red-200 rounded-2xl text-xs font-black text-gray-800 flex items-center gap-2 shadow-sm transition-all active:scale-95"
                                    >
                                        <${GoogleIcon} /> Sign In
                                    </button>
                                `}

                                <!-- Admin Vault button: ONLY displayed to verified administrators -->
                                ${isAdmin && html`
                                    <button 
                                        onClick=${() => setShowAdmin(!showAdmin)}
                                        className=${`px-4 py-2.5 rounded-2xl font-black text-xs uppercase tracking-wider flex items-center gap-2 border transition-all shadow-sm ${showAdmin ? 'bg-red-600 text-white border-red-600' : 'bg-white border-gray-200 text-gray-700 hover:text-red-600 hover:border-red-200'}`}
                                    >
                                        <${SettingsIcon} size=${18} /> Admin Vault
                                    </button>
                                `}
                            </div>
                        </header>

                        <main>
                            ${(showAdmin && isAdmin) ? html`
                                <${AdminPanel} 
                                    history=${history} 
                                    onClear=${clearHistory} 
                                    onClose=${() => setShowAdmin(false)} 
                                    onViewAudit=${viewAudit}
                                    adminEmail=${user?.email}
                                    paypalSubUrl=${paypalSubUrl}
                                    paypalDocUrl=${paypalDocUrl}
                                    onSavePaypalUrls=${handleSavePaypalUrls}
                                    onLogout=${logout}
                                />
                            ` : isLoading ? html`
                                <${Loader} />
                            ` : result ? html`
                                <${AuditResultView} 
                                    result=${result} 
                                    businessName=${activeBusiness} 
                                    businessDetails=${activeBusinessDetails}
                                    onReset=${() => { setResult(null); setActiveBusinessDetails(null); }}
                                    isAdmin=${isAdmin}
                                    isSubscriber=${isSubscriber}
                                    isUnlocked=${unlockedAudits.includes(activeBusiness)}
                                    onUnlockRequest=${(type) => {
                                        if (type === 'subscribe') {
                                            setShowSubModal(true);
                                        } else {
                                            setShowUnlockModal(true);
                                        }
                                    }}
                                />
                            ` : html`
                                <div className="space-y-16">
                                    <div className="text-center space-y-6 pt-10">
                                        <h2 className="text-5xl md:text-7xl font-black text-gray-900 leading-none tracking-tight">Are you losing <br/><span className="text-red-600">Local Customers?</span></h2>
                                        <p className="text-xl text-gray-500 max-w-2xl mx-auto leading-relaxed">
                                            Most Google Business Profiles are only 40% optimized. Get an instant multi-signal audit to discover how to dominate your local market.
                                        </p>
                                    </div>

                                    <!-- Animated Stats Section Under "Are you losing Local Customers?" -->
                                    <${LocalStatsSection} />

                                    <${BusinessInputForm} 
                                        onSubmit=${runAudit} 
                                        isLoading=${isLoading}
                                        isAdmin=${isAdmin}
                                        isSubscriber=${isSubscriber}
                                        auditsThisWeek=${auditsThisWeek}
                                        weeklyLimit=${WEEKLY_FREE_LIMIT}
                                        onUpgradeRequest=${() => setShowSubModal(true)}
                                        user=${user}
                                    />
                                </div>
                            `}
                        </main>

                        <!-- Modals -->
                        <${SubscriptionModal}
                            isOpen=${showSubModal}
                            onClose=${() => setShowSubModal(false)}
                            onActivateSubscription=${activateSubscription}
                            paypalSubUrl=${paypalSubUrl}
                        />

                        <${ReportUnlockModal}
                            isOpen=${showUnlockModal}
                            onClose=${() => setShowUnlockModal(false)}
                            businessName=${activeBusiness}
                            onUnlockSingle=${unlockSingleReport}
                            onShowSubscribe=${() => {
                                setShowUnlockModal(false);
                                setShowSubModal(true);
                            }}
                            paypalDocUrl=${paypalDocUrl}
                        />

                        <!-- Requested Footer -->
                        <footer className="no-print pt-20 border-t border-gray-100 flex flex-col md:flex-row justify-between items-center gap-6 text-gray-500 font-bold text-sm">
                            <div className="flex flex-wrap items-center justify-center md:justify-start gap-2 text-center md:text-left">
                                <span>2026 Marketing Management Enterprise LLC</span>
                                <span className="text-gray-300">|</span>
                                <span>Google Business Profile Auditor</span>
                                <span className="text-gray-300">|</span>
                                <span className="text-gray-600 font-semibold">Powered by Gemini Precision Intelligence</span>
                            </div>
                            <div className="flex gap-8 text-xs uppercase tracking-widest text-gray-400">
                                <a href="javascript:void(0)" className="hover:text-gray-900 transition-colors">Privacy</a>
                                <a href="javascript:void(0)" className="hover:text-gray-900 transition-colors">Terms</a>
                                <a href="javascript:void(0)" className="hover:text-gray-900 transition-colors">Contact</a>
                            </div>
                        </footer>
                    </div>

                    <div className="fixed top-0 left-0 w-full h-full pointer-events-none -z-0">
                        <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-red-50 rounded-full blur-[120px] opacity-60"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-50 rounded-full blur-[120px] opacity-60"></div>
                    </div>
                </div>
            `;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    })();
    </script>
</body>
</html>
