    <script>
        // Infrastructure Shield: Suppress noise from browser extensions (MetaMask, Wallet, etc.)
        (function() {
            const isExtensionNoise = (msg) => {
                if (!msg || typeof msg !== 'string') return false;
                const low = msg.toLowerCase();
                return low.includes('metamask') || low.includes('ethereum') || 
                       low.includes('web3') || low.includes('wallet') ||
                       (low.includes('failed to connect') && low.includes('extension'));
            };

            // Global Error Shield
            window.onerror = function(msg, url, line, col, error) {
                if (isExtensionNoise(msg)) return true;
                console.error('Core Error:', msg, { url, line, col, error });
                return false;
            };
            window.onunhandledrejection = function(e) {
                const msg = e.reason && (e.reason.message || e.reason);
                if (isExtensionNoise(msg)) { e.preventDefault(); return true; }
            };

            // Console Shield
            ['error', 'warn', 'info'].forEach(m => {
                const orig = console[m];
                console[m] = (...args) => {
                    const combined = args.map(a => {
                        try { return typeof a === 'string' ? a : JSON.stringify(a); } catch (e) { return String(a); }
                    }).join(' ');
                    if (isExtensionNoise(combined)) return;
                    orig.apply(console, args);
                };
            });

            // Mock Provider to preempt extension injection and stop connection errors
            if (!window.ethereum) {
                const silent = { request: () => Promise.resolve([]), on: () => {}, removeListener: () => {}, isMetaMask: false };
                try {
                    Object.defineProperty(window, 'ethereum', { value: silent, writable: false, configurable: false });
                } catch (e) { window.ethereum = silent; }
            }
        })();
    </script>

                const step = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    // Ease out cubic
                    const ease = 1 - Math.pow(1 - progress, 3);
                    const current = ease * end;
                    setVal(current);

                    if (progress < 1) {
                        reqId = requestAnimationFrame(step);
                    } else {
                        setVal(end);
                    }
                };

                reqId = requestAnimationFrame(step);
                return () => cancelAnimationFrame(reqId);
            }, [end, duration]);

            const displayValue = decimals > 0 ? val.toFixed(decimals) : Math.round(val);
            return html`<span>${prefix}${displayValue}${suffix}</span>`;

            const pageWidth = 595.28;
            const pageHeight = 841.89;

            const location = businessDetails?.location || 'Local Market Area';
            const phone = businessDetails?.phoneNumber || 'Not Listed';
            const score = result?.overallScore || 0;

            const getScoreColor = (s) => {
                if (s < 45) return [239, 68, 68]; // #ef4444 Red
                if (s < 75) return [245, 158, 11]; // #f59e0b Amber

            doc.text(`DATE: ${dateStr.toUpperCase()}`, pageWidth - margin, 32, { align: 'right' });

            // 2. Business Profile Details Box
            let currentY = 90;

            doc.setDrawColor(229, 231, 235); // #e5e7eb
            doc.setLineWidth(1);

            doc.setTextColor(17, 24, 39);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(14);
            doc.text(business, margin + 14, currentY + 22);

            doc.roundedRect(margin, currentY, contentWidth, 76, 6, 6, 'FD');

            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold');

            doc.text("/ 100 HEALTH", margin + 50, currentY + 54, { align: 'center' });

                try {
                    const response = await fetch(`${API_BASE}/api/find-regional-leads`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ niche, region })
                    });

                    if (!response.ok) throw new Error("Failed to search regional leads");
                    const data = await response.json();
                    const scouted = data.leads || [];
                    setLeads(scouted);
                    if (onLeadsFound && scouted.length > 0) {
                        onLeadsFound(scouted, niche, region);
                    }

                    `"${(l.location || '').replace(/"/g, '""')}"`,

            const [credits, setCredits] = useState(0);
            const [showPricingModal, setShowPricingModal] = useState(false);

            const [paypalUrls, setPaypalUrls] = useState(() => {

            const handleSavePaypalUrls = (newUrls) => {

            useEffect(() => {

            // Load and sync user profile from Firestore once authenticated with Google
            useEffect(() => {

                const loadProfile = async () => {
                    try {

                        if (snap.exists()) {
                            const data = snap.data();
                            setUserProfile(prev => ({
                                ...prev,
                                ...data,
                                name: data.name || user.displayName || prev.name || '',
                                email: user.email || ''
                            }));

                            const initial = {
                                name: user.displayName || '',
                                email: user.email || '',
                                phoneNumber: userProfile.phoneNumber || '',
                                agencyName: userProfile.agencyName || '',
                                website: userProfile.website || '',
                                defaultLocation: userProfile.defaultLocation || '',
                                customPdfNotes: userProfile.customPdfNotes || ''
                            };
                            setUserProfile(initial);
                            await setDoc(doc(db, "users", user.uid), initial, { merge: true });

                        console.warn("Could not load user profile from Firestore:", err);

                loadProfile();

            const handleSaveProfile = async (newProfile) => {
                const merged = { ...userProfile, ...newProfile, email: user?.email || userProfile.email || '' };
                setUserProfile(merged);
                localStorage.setItem('gbp_user_profile', JSON.stringify(merged));
                if (user) {
                    localStorage.setItem(`gbp_user_profile_${user.uid}`, JSON.stringify(merged));

                setPlan(savedPlan);
                setCredits(savedCredits);

                                const usersSnap = await getDocs(collection(db, "users"));

                                console.warn("Could not fetch users:", e);

                fetchHistory();

            // 30-Day Cycle Window & Non-Rollover Logic
            const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            let cycleStart = user ? parseInt(localStorage.getItem(`gbp_cycle_start_${user.uid}`) || '0', 10) : now;
            
            if (!cycleStart || (now - cycleStart) >= THIRTY_DAYS_MS) {
                cycleStart = now;
                if (user) {
                    localStorage.setItem(`gbp_cycle_start_${user.uid}`, cycleStart.toString());
                }
            }

            const cycleEndDate = cycleStart + THIRTY_DAYS_MS;
            const cycleDaysLeft = Math.max(1, Math.ceil((cycleEndDate - now) / (24 * 60 * 60 * 1000)));

            const userLeads = history.filter(h => h.userId === user?.uid);
            const auditsThisCycle = userLeads.filter(h => h.timestamp && new Date(h.timestamp).getTime() >= cycleStart).length;

            const runAudit = async (data) => {
                let activeUser = user;

                // Google Sign-in on audit generation if not yet authenticated
                if (!activeUser) {
                    try {
                        const provider = new GoogleAuthProvider();
                        const cred = await signInWithPopup(auth, provider);
                        activeUser = cred.user;
                        setUser(activeUser);
                        setCurrentView('dashboard');

                        console.log("Google sign-in closed or aborted by user:", authErr);
                        return;

                if (!activeUser) return;

                const userIsAdmin = Boolean(activeUser.email && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(activeUser.email.toLowerCase().trim()));
                const userPlan = localStorage.getItem(`gbp_plan_${activeUser.uid}`) || plan;
                const userCredits = parseInt(localStorage.getItem(`gbp_credits_${activeUser.uid}`) || credits.toString(), 10);

                // Quota validation for 30-day non-rollover cycle
                let willConsumeCredit = false;

                if (!userIsAdmin) {
                    if (userPlan === 'agency_249') {
                        if (auditsThisCycle >= 700) {
                            if (userCredits > 0) {
                                willConsumeCredit = true;
                            } else {
                                setShowPricingModal(true);
                                return;
                            }
                        }
                    } else if (userPlan === 'pro_49') {
                        if (auditsThisCycle >= 100) {
                            if (userCredits > 0) {
                                willConsumeCredit = true;
                            } else {
                                setShowPricingModal(true);
                                return;
                            }
                        }
                    } else {
                        // Free Tier: 1 audit per 30 days (max 6 per year)
                        if (auditsThisCycle >= 1 || userLeads.length >= 6) {
                            if (userCredits > 0) {
                                willConsumeCredit = true;
                            } else {
                                setShowPricingModal(true);
                                return;
                            }
                        }
                    }
                }

                setIsLoading(true);
                setError(null);
                setResult(null);
                setActiveBusiness(data.businessName);
                setActiveBusinessDetails(data);

                try {
                    const response = await fetch(`${API_BASE}/api/audit`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            businessName: data.businessName,
                            location: data.location,
                            phoneNumber: data.phoneNumber,
                            website: data.website,
                            niche: data.niche
                        })
                    });

                    if (!response.ok) throw new Error("Audit generation failed");
                    const auditResult = await response.json();

                    // Consume credit if applicable
                    if (willConsumeCredit) {
                        const newBal = Math.max(0, userCredits - 1);
                        setCredits(newBal);
                        localStorage.setItem(`gbp_credits_${activeUser.uid}`, newBal.toString());
                    }

                    // Save lead to Firestore with verified Google user tracking
                    const leadData = {
                        ...data,
                        email: data.email || activeUser.email || '',
                        userEmail: activeUser.email || '',
                        userDisplayName: activeUser.displayName || '',
                        userId: activeUser.uid,
                        plan: userPlan,
                        consumedCredit: willConsumeCredit,
                        overallScore: auditResult.overallScore,
                        auditBreakdown: auditResult.auditBreakdown,
                        recommendations: auditResult.recommendations,
                        timestamp: new Date().toISOString(),
                        serverTimestamp: serverTimestamp()
                    };
                    
                    await addDoc(collection(db, "leads"), leadData);

                    // Also record to master audits collection
                    try {
                        await addDoc(collection(db, "audits"), leadData);
                    } catch (audErr) {
                        console.warn("Could not record to audits collection:", audErr);
                    }

                    // Update user profile presence and stats in Firestore
                    try {
                        await setDoc(doc(db, "users", activeUser.uid), {
                            email: activeUser.email,
                            name: activeUser.displayName || userProfile.name || '',
                            subscriptionPlan: userPlan,
                            creditsBalance: willConsumeCredit ? Math.max(0, userCredits - 1) : userCredits,
                            lastActiveTimestamp: Date.now()
                        }, { merge: true });
                    } catch (uErr) {
                        console.warn("Could not update user record:", uErr);
                    }

                    setResult(auditResult);
                    setHistory(prev => [leadData, ...prev]);
                    setAllAudits(prev => [leadData, ...prev]);

                    console.error("Audit failed:", err);
                    setError("Failed to process audit. Check console.");

                    setIsLoading(false);

                    setActiveBusiness(lead.businessName);
                    setActiveBusinessDetails(lead);

            const clearHistory = async () => {

                    return;

                setIsLoading(true);
                try {
                    const snapshot = await getDocs(collection(db, "leads"));
                    const batch = snapshot.docs.map(d => deleteDoc(doc(db, "leads", d.id)));
                    await Promise.all(batch);
                    setHistory([]);
                    alert("Vault purged successfully.");

                    console.error("Purge failed:", err);
                    alert("Failed to purge vault. Check permissions.");

                    setIsLoading(false);
                }
            };

            const handleSaveScoutedLeads = async (newLeads, nicheParam, regionParam) => {
                const enriched = (newLeads || []).map(l => ({
                    ...l,
                    id: l.id || `lead_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`,
                    niche: l.niche || nicheParam || '',
                    location: l.location || regionParam || '',
                    scoutedByUserEmail: user?.email || 'Platform Scout',
                    scoutedByUserId: user?.uid || 'anonymous',
                    timestamp: new Date().toISOString()
                }));
                setAllLeads(prev => [...enriched, ...prev]);

                // Record in Firestore scouted_leads collection
                for (const lead of enriched) {
                    try {
                        await addDoc(collection(db, "scouted_leads"), lead);

                        console.warn("Could not save scouted lead to Firestore:", e);

                    if (match) {
                        return { ...u, plan: newPlan, subscriptionPlan: newPlan };
                    }
                    return u;

                // If currently authenticated user is targeted, sync local active plan
                if (user && (user.uid === userIdOrEmail || user.email?.toLowerCase() === userIdOrEmail?.toLowerCase())) {
                    setPlan(newPlan);
                    localStorage.setItem(`gbp_plan_${user.uid}`, newPlan);
                }

                try {
                    await setDoc(doc(db, "users", userIdOrEmail), { subscriptionPlan: newPlan }, { merge: true });
                } catch (e) {
                    console.warn("Could not update user plan in Firestore:", e);
                }
            };

            const handleAdminUpdateUserCredits = async (userIdOrEmail, creditDelta) => {
                setAllUsers(prev => prev.map(u => {
                    const match = (u.id === userIdOrEmail) || (u.userId === userIdOrEmail) || (u.email?.toLowerCase() === userIdOrEmail?.toLowerCase());
                    if (match) {
                        const newBal = (u.credits ?? u.creditsBalance ?? 0) + creditDelta;
                        return { ...u, credits: newBal, creditsBalance: newBal };

                    return u;

                    setCredits(updated);
                    localStorage.setItem(`gbp_credits_${user.uid}`, updated.toString());

                    const currentBal = snap.exists() ? (snap.data().creditsBalance || 0) : 0;
                    await setDoc(userRef, { creditsBalance: currentBal + creditDelta }, { merge: true });
                } catch (e) {
                    console.warn("Could not update credits in Firestore:", e);

            const handleAdminAuditLead = (lead) => {

                    location: lead.location || '',
                    niche: lead.niche || '',
                    website: lead.website || '',

                });

                                title="GBP Auditor Pro - Home"

                                    <div className="w-10 h-10 sm:w-11 sm:h-11 bg-[#0c101d] rounded-[14px] flex items-center justify-center font-black text-xs sm:text-sm text-white tracking-wider">

                                            <line x1="4" y1="7" x2="20" y2="7"></line>

                                            >

                                                    <span>Landing & Pricing</span>

                                            >

                                                    <span>Dashboard</span>

                                                <button 
                                                    onClick=${() => {
                                                        setCurrentView('admin');
                                                        setIsNavMenuOpen(false);
                                                    }}
                                                    className=${`w-full min-h-[44px] flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all cursor-pointer ${currentView === 'admin' ? 'bg-red-700 text-white shadow-sm' : 'bg-[#1a1118] text-red-300 hover:bg-red-950/80 hover:text-red-200 border border-red-900/40'}`}
                                                >
                                                    <span className="flex items-center gap-2.5">
                                                        <${ShieldCheckIcon} size=${16} className=${currentView === 'admin' ? 'text-white' : 'text-red-400'} />
                                                        <span>Admin Vault</span>
                                                    </span>
                                                    <span className="text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md bg-red-900 text-red-100 border border-red-700">Admin</span>
                                                </button>
                                            `}

                                            <!-- Pricing -->
                                            <button 
                                                onClick=${() => {
                                                    setShowPricingModal(true);
                                                    setIsNavMenuOpen(false);
                                                }}
                                                className="w-full min-h-[44px] flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold bg-[#1d1715] hover:bg-[#291f1a] text-amber-200 border border-amber-500/40 transition-all active:scale-[0.99] cursor-pointer"
                                                title="View Pricing Plans & Credit Packs"
                                            >
                                                <span className="flex items-center gap-2.5">
                                                    <${CrownIcon} size=${16} className="text-amber-400" />
                                                    <span>Pricing</span>
                                                </span>
                                                <span className="text-[10px] font-bold text-amber-200 bg-amber-950 border border-amber-600/50 px-2 py-0.5 rounded-md">Plans & Packs</span>
                                            </button>
                                        </div>

                                        <!-- User Account & Profile Section -->
                                        <div className="pt-3 border-t border-slate-800">
                                            ${user ? html`
                                                <div className="space-y-2">
                                                    <button 
                                                        onClick=${() => {
                                                            setCurrentView('dashboard');
                                                            setActiveDashboardTab('profile');
                                                            setIsNavMenuOpen(false);
                                                        }}
                                                        className="w-full p-2.5 rounded-xl bg-[#121829] hover:bg-[#1a2238] border border-slate-800 text-left transition-colors flex items-center gap-2.5 group cursor-pointer"
                                                        title="Go to My Profile in Dashboard"
                                                    >
                                                        <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-red-600 to-amber-500 text-white font-black flex items-center justify-center text-xs flex-shrink-0 shadow-sm">
                                                            ${(userProfile?.agencyName || userProfile?.name || user.displayName || user.email || 'U').charAt(0).toUpperCase()}
                                                        </div>
                                                        <div className="truncate flex-1">
                                                            <p className="text-xs font-bold text-white truncate group-hover:text-red-300 transition-colors">
                                                                ${userProfile?.agencyName || userProfile?.name || user.displayName || user.email}
                                                            </p>
                                                            <p className="text-[11px] font-medium text-slate-300 flex items-center gap-1">
                                                                <${UserIcon} size=${11} className="text-slate-400" /> My Profile · Settings
                                                            </p>
                                                        </div>
                                                        <${ChevronRightIcon} size=${15} className="text-slate-400 group-hover:text-white transition-colors" />
                                                    </button>
                                                    
                                                    <button 
                                                        onClick=${() => {
                                                            logout();
                                                            setIsNavMenuOpen(false);
                                                        }}
                                                        className="w-full min-h-[40px] py-2 px-3 text-xs font-bold bg-[#121829] hover:bg-red-950/70 text-slate-200 hover:text-red-200 border border-slate-800 hover:border-red-800/60 rounded-xl transition-colors flex items-center justify-center gap-1.5 cursor-pointer"
                                                    >
                                                        <${LogOutIcon} size=${14} /> Sign Out
                                                    </button>
                                                </div>
                                            ` : html`
                                                <div className="space-y-2">
                                                    <button 
                                                        onClick=${() => {
                                                            login();
                                                            setIsNavMenuOpen(false);
                                                        }}
                                                        className="w-full min-h-[44px] py-2.5 px-4 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white rounded-xl text-xs font-black flex items-center justify-center gap-2 shadow-lg transition-all active:scale-95 cursor-pointer"
                                                    >
                                                        <${GoogleIcon} /> Sign In with Google
                                                    </button>
                                                    <p className="text-center text-[11px] text-slate-300 font-medium">Get 1 Free Audit Every Month</p>
                                                </div>
                                            `}
                                        </div>

                                    </div>
                                `}
                            </div>

                        </div>
                    </header>

                    <!-- Main Content Container -->
                    <div className="max-w-6xl mx-auto p-4 sm:p-8 md:p-12 space-y-10 relative z-10 w-full flex-1">
                        
                        <!-- Main Screen Render based on active flow -->
                        <main>
                            ${(currentView === 'admin' && isAdmin) ? html`
                                <${AdminPanel} 
                                    history=${history} 
                                    allAudits=${allAudits.length > 0 ? allAudits : history}
                                    allLeads=${allLeads}
                                    allUsers=${allUsers}
                                    onClear=${clearHistory} 
                                    onClose=${() => setCurrentView('dashboard')} 
                                    onViewAudit=${viewAudit}
                                    onAuditLead=${handleAdminAuditLead}
                                    adminEmail=${user?.email}
                                    paypalUrls=${paypalUrls}
                                    onSavePaypalUrls=${handleSavePaypalUrls}
                                    onLogout=${logout}
                                    onUpdateUserPlan=${handleAdminUpdateUserPlan}
                                    onUpdateUserCredits=${handleAdminUpdateUserCredits}
                                    onSetUserPlan=${handleSelectPlan}
                                    onAddTestCredits=${(amt) => handleAddCredits(amt, 'Test Credits')}
                                    currentPlan=${plan}
                                    creditsBalance=${credits}
                                    onGeneratePdf=${handleDirectPdfDownload}
                                />
                            ` : currentView === 'dashboard' ? html`
                                <${DashboardView} 
                                    user=${user}
                                    userProfile=${userProfile}
                                    onSaveProfile=${handleSaveProfile}
                                    plan=${plan}
                                    credits=${credits}
                                    history=${history.filter(h => h.userId === user?.uid)}
                                    auditsThisCycle=${auditsThisCycle}
                                    cycleDaysLeft=${cycleDaysLeft}
                                    cycleEndDate=${cycleEndDate}
                                    onRunAudit=${runAudit}
                                    isLoading=${isLoading}
                                    result=${result}
                                    onResetResult=${() => { setResult(null); setActiveBusinessDetails(null); }}
                                    activeBusiness=${activeBusiness}
                                    activeBusinessDetails=${activeBusinessDetails}
                                    onOpenPricing=${() => setShowPricingModal(true)}
                                    onViewAudit=${viewAudit}
                                    onGeneratePdf=${handleDirectPdfDownload}
                                    isAdmin=${isAdmin}
                                    paypalUrls=${paypalUrls}
                                    onGoToLanding=${() => setCurrentView('landing')}
                                    prefillData=${prefillData}
                                    onClearPrefill=${() => setPrefillData(null)}
                                    onAuditLead=${(lead) => {
                                        setPrefillData({
                                            businessName: lead.businessName || '',
                                            location: lead.location || '',
                                            niche: lead.niche || '',
                                            website: lead.website || '',
                                            phoneNumber: lead.phoneNumber || ''
                                        });
                                        setActiveDashboardTab('run');
                                    }}
                                    onSaveScoutedLeads=${handleSaveScoutedLeads}
                                    activeTab=${activeDashboardTab}
                                    onTabChange=${(tab) => setActiveDashboardTab(tab)}
                                />
                            ` : html`
                                <${LandingPage} 
                                    onStartAudit=${() => {
                                        if (user) {
                                            setCurrentView('dashboard');
                                        } else {
                                            login();
                                        }
                                    }}
                                    onLogin=${login}
                                    user=${user}
                                    onGoToDashboard=${() => setCurrentView('dashboard')}
                                    onOpenPricing=${() => setShowPricingModal(true)}
                                    paypalUrls=${paypalUrls}
                                    isAdmin=${isAdmin}
                                    onOpenAdmin=${() => setCurrentView('admin')}
                                />
                            `}
                        </main>

                        <!-- Pricing & Credits Modal -->
                        <${PricingAndCreditsModal}
                            isOpen=${showPricingModal}
                            onClose=${() => setShowPricingModal(false)}
                            currentPlan=${plan}
                            creditsBalance=${credits}
                            auditsThisMonth=${auditsThisCycle}
                            auditsThisYear=${history.length}
                            onSelectPlan=${handleSelectPlan}
                            onAddCredits=${handleAddCredits}
                            paypalUrls=${paypalUrls}
                            isAdmin=${isAdmin}
                        />

                        <!-- PDF Preview Modal -->
                        <${PdfPreviewModal}
                            isOpen=${Boolean(previewPdfData)}
                            onClose=${() => setPreviewPdfData(null)}
                            pdfData=${previewPdfData}
                            onDownload=${() => previewPdfData?.download()}
                        />
                    </div>

                    <!-- Footer -->
                    <footer className="no-print pt-16 border-t border-gray-100 flex flex-col md:flex-row justify-between items-center gap-6 text-gray-500 font-bold text-sm max-w-6xl mx-auto w-full z-10 relative">
                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-2 text-center md:text-left">
                            <span>2026 Marketing Management Enterprise LLC</span>
                            <span className="text-gray-300">|</span>
                            <span>Google Business Profile Auditor</span>
                            <span className="text-gray-300">|</span>
                            <span className="text-gray-600 font-semibold">Gemini Precision Local Intelligence</span>
                        </div>
                        <div className="flex gap-8 text-xs uppercase tracking-widest text-gray-400">
                            <a href="javascript:void(0)" onClick=${() => setCurrentView('landing')} className="hover:text-gray-900 transition-colors">Home</a>
                            <a href="#pricing" onClick=${() => { setCurrentView('landing'); }} className="hover:text-gray-900 transition-colors">Pricing</a>
                            <a href="#reviews" onClick=${() => { setCurrentView('landing'); }} className="hover:text-gray-900 transition-colors">Reviews</a>
                        </div>
                    </footer>

                    <div className="fixed top-0 left-0 w-full h-full pointer-events-none -z-0">
                        <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-red-50 rounded-full blur-[120px] opacity-60"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-50 rounded-full blur-[120px] opacity-60"></div>
                    </div>
                </div>
            `;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    })();
    </script>
</body>
</html>
