    <script>
        // Infrastructure Shield: Suppress noise from browser extensions (MetaMask, Wallet, etc.)
        (function() {
            const isExtensionNoise = (msg) => {
                if (!msg || typeof msg !== 'string') return false;
                const low = msg.toLowerCase();
                return low.includes('metamask') || low.includes('ethereum') || 
                       low.includes('web3') || low.includes('wallet') ||
                       (low.includes('failed to connect') && low.includes('extension'));
            };

            // Global Error Shield
            window.onerror = function(msg, url, line, col, error) {
                if (isExtensionNoise(msg)) return true;
                console.error('Core Error:', msg, { url, line, col, error });
                return false;
            };
            window.onunhandledrejection = function(e) {
                const msg = e.reason && (e.reason.message || e.reason);
                if (isExtensionNoise(msg)) { e.preventDefault(); return true; }
            };

            // Console Shield
            ['error', 'warn', 'info'].forEach(m => {
                const orig = console[m];
                console[m] = (...args) => {
                    const combined = args.map(a => {
                        try { return typeof a === 'string' ? a : JSON.stringify(a); } catch (e) { return String(a); }
                    }).join(' ');
                    if (isExtensionNoise(combined)) return;
                    orig.apply(console, args);
                };
            });

            // Mock Provider to preempt extension injection and stop connection errors
            if (!window.ethereum) {
                const silent = { request: () => Promise.resolve([]), on: () => {}, removeListener: () => {}, isMetaMask: false };
                try {
                    Object.defineProperty(window, 'ethereum', { value: silent, writable: false, configurable: false });
                } catch (e) { window.ethereum = silent; }
            }
        })();
    </script>

            const [val, setVal] = useState(0);

                let reqId;

                const step = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    // Ease out cubic
                    const ease = 1 - Math.pow(1 - progress, 3);
                    const current = ease * end;
                    setVal(current);

                    if (progress < 1) {
                        reqId = requestAnimationFrame(step);
                    } else {
                        setVal(end);
                    }
                };

                reqId = requestAnimationFrame(step);
                return () => cancelAnimationFrame(reqId);
            }, [end, duration]);

            const displayValue = decimals > 0 ? val.toFixed(decimals) : Math.round(val);
            return html`<span>${prefix}${displayValue}${suffix}</span>`;

            });

            const handleSavePaypalUrls = (newUrls) => {
                const merged = { ...DEFAULT_PAYPAL_URLS, ...newUrls };
                setPaypalUrls(merged);
                localStorage.setItem('gbp_paypal_urls', JSON.stringify(merged));
            };

            // Track active session duration for app analytics
            useEffect(() => {
                const interval = setInterval(() => {
                    const key = 'gbp_total_time_spent';
                    const cur = parseInt(localStorage.getItem(key) || '320', 10);
                    localStorage.setItem(key, (cur + 15).toString());
                }, 15000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setIsInitialLoading(false);
                    // When user authenticates, transition to Dashboard if they were on Landing
                    if (u) {
                        setCurrentView(prev => prev === 'landing' ? 'dashboard' : prev);
                    }
                });
                return unsubscribe;
            }, []);

            // Check if current user is an authorized admin
            const isAdmin = Boolean(user?.email && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(user.email.toLowerCase().trim()));

            // Load subscription & credits for logged in user
            useEffect(() => {
                if (!user) {
                    setPlan('free');
                    setCredits(0);
                    return;
                }
                const savedPlan = localStorage.getItem(`gbp_plan_${user.uid}`) || 'free';
                const savedCredits = parseInt(localStorage.getItem(`gbp_credits_${user.uid}`) || '0', 10);
                setPlan(savedPlan);
                setCredits(savedCredits);
            }, [user]);

            const handleSelectPlan = (newPlan) => {
                setPlan(newPlan);
                if (user) {
                    localStorage.setItem(`gbp_plan_${user.uid}`, newPlan);
                }
                setShowPricingModal(false);
                const label = newPlan === 'pro_49' ? 'Growth Pro ($49/mo - 100 audits)' : newPlan === 'agency_249' ? 'Scale Agency ($249/mo - 700 audits)' : 'Free Starter (1 audit/mo, max 6/yr)';
                alert(`Plan activated: ${label}`);
            };

            const handleAddCredits = (amount, title) => {
                const updated = credits + amount;
                setCredits(updated);
                if (user) {
                    localStorage.setItem(`gbp_credits_${user.uid}`, updated.toString());
                }
                setShowPricingModal(false);
                alert(`Added +${amount} credits to your account! Total credits: ${updated}`);
            };

            const login = async () => {
                const provider = new GoogleAuthProvider();
                try {
                    const cred = await signInWithPopup(auth, provider);
                    if (cred?.user) {
                        setUser(cred.user);
                        setCurrentView('dashboard');
                    }
                } catch (err) {
                    console.error("Login failed", err);
                }
            };

            const logout = () => {
                signOut(auth);
                setCurrentView('landing');
            };

            useEffect(() => {
                if (!user) return;
                
                const fetchHistory = async () => {
                    try {
                        let q;
                        if (isAdmin) {
                            // Authorized Admins see all leads
                            q = query(
                                collection(db, "leads"), 
                                orderBy("timestamp", "desc")
                            );
                        } else {
                            // Regular users see only their own
                            q = query(
                                collection(db, "leads"), 
                                where("userId", "==", user.uid),
                                orderBy("timestamp", "desc")
                            );
                        }
                        const snapshot = await getDocs(q);
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setHistory(data);
                    } catch (err) {
                        console.error("Failed to fetch history:", err);
                    }
                };
                fetchHistory();
            }, [user, isAdmin]);

            // 30-Day Cycle Window & Non-Rollover Logic
            const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            let cycleStart = user ? parseInt(localStorage.getItem(`gbp_cycle_start_${user.uid}`) || '0', 10) : now;
            
            if (!cycleStart || (now - cycleStart) >= THIRTY_DAYS_MS) {
                cycleStart = now;
                if (user) {
                    localStorage.setItem(`gbp_cycle_start_${user.uid}`, cycleStart.toString());
                }
            }

            const cycleEndDate = cycleStart + THIRTY_DAYS_MS;
            const cycleDaysLeft = Math.max(1, Math.ceil((cycleEndDate - now) / (24 * 60 * 60 * 1000)));

            const userLeads = history.filter(h => h.userId === user?.uid);
            const auditsThisCycle = userLeads.filter(h => h.timestamp && new Date(h.timestamp).getTime() >= cycleStart).length;

            const runAudit = async (data) => {
                let activeUser = user;

                // Google Sign-in on audit generation if not yet authenticated
                if (!activeUser) {
                    try {
                        const provider = new GoogleAuthProvider();
                        const cred = await signInWithPopup(auth, provider);
                        activeUser = cred.user;
                        setUser(activeUser);
                        setCurrentView('dashboard');
                    } catch (authErr) {
                        console.log("Google sign-in closed or aborted by user:", authErr);
                        return;
                    }
                }

                if (!activeUser) return;

                const userIsAdmin = Boolean(activeUser.email && ADMIN_EMAILS.map(e => e.toLowerCase()).includes(activeUser.email.toLowerCase().trim()));
                const userPlan = localStorage.getItem(`gbp_plan_${activeUser.uid}`) || plan;
                const userCredits = parseInt(localStorage.getItem(`gbp_credits_${activeUser.uid}`) || credits.toString(), 10);

                // Quota validation for 30-day non-rollover cycle
                let willConsumeCredit = false;

                if (!userIsAdmin) {
                    if (userPlan === 'agency_249') {
                        if (auditsThisCycle >= 700) {
                            if (userCredits > 0) {
                                willConsumeCredit = true;
                            } else {
                                setShowPricingModal(true);
                                return;
                            }
                        }
                    } else if (userPlan === 'pro_49') {
                        if (auditsThisCycle >= 100) {
                            if (userCredits > 0) {
                                willConsumeCredit = true;
                            } else {
                                setShowPricingModal(true);
                                return;
                            }
                        }
                    } else {
                        // Free Tier: 1 audit per 30 days (max 6 per year)
                        if (auditsThisCycle >= 1 || userLeads.length >= 6) {
                            if (userCredits > 0) {
                                willConsumeCredit = true;
                            } else {
                                setShowPricingModal(true);
                                return;
                            }
                        }
                    }
                }

                setIsLoading(true);
                setError(null);
                setResult(null);
                setActiveBusiness(data.businessName);
                setActiveBusinessDetails(data);

                try {
                    const response = await fetch(`${API_BASE}/api/audit`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            businessName: data.businessName,
                            location: data.location,
                            phoneNumber: data.phoneNumber
                        })
                    });

                    if (!response.ok) throw new Error("Audit generation failed");
                    const auditResult = await response.json();

                    // Consume credit if applicable
                    if (willConsumeCredit) {
                        const newBal = Math.max(0, userCredits - 1);
                        setCredits(newBal);
                        localStorage.setItem(`gbp_credits_${activeUser.uid}`, newBal.toString());
                    }

                    // Save lead to Firestore with verified Google user tracking
                    const leadData = {
                        ...data,
                        email: data.email || activeUser.email || '',
                        userEmail: activeUser.email || '',
                        userDisplayName: activeUser.displayName || '',
                        userId: activeUser.uid,
                        plan: userPlan,
                        consumedCredit: willConsumeCredit,
                        overallScore: auditResult.overallScore,
                        auditBreakdown: auditResult.auditBreakdown,
                        recommendations: auditResult.recommendations,
                        timestamp: new Date().toISOString(),
                        serverTimestamp: serverTimestamp()
                    };
                    
                    await addDoc(collection(db, "leads"), leadData);

                    setResult(auditResult);
                    setHistory(prev => [leadData, ...prev]);

                } catch (err) {
                    console.error("Audit failed:", err);
                    setError("Failed to process audit. Check console.");
                } finally {
                    setIsLoading(false);
                }
            };

            const viewAudit = (lead) => {
                if (lead.auditBreakdown && lead.recommendations) {
                    setResult({
                        overallScore: lead.overallScore,
                        auditBreakdown: lead.auditBreakdown,
                        recommendations: lead.recommendations
                    });
                    setActiveBusiness(lead.businessName);
                    setActiveBusinessDetails(lead);
                    setCurrentView('dashboard');
                } else {
                    setResult({
                        overallScore: lead.overallScore,
                        auditBreakdown: [
                            { category: 'Historical Data', score: lead.overallScore, comment: 'Archive scan format.' }
                        ],
                        recommendations: [
                            { title: 'Data Migration', description: 'Contact support to migrate legacy reports.' }
                        ]
                    });
                    setActiveBusiness(lead.businessName);
                    setActiveBusinessDetails(lead);
                    setCurrentView('dashboard');
                }
            };

            const handleDirectPdfDownload = (item) => {
                const pdf = generateAuditPDF({
                    result: item,
                    businessName: item.businessName,
                    businessDetails: item
                });
                if (pdf && pdf.download) {
                    pdf.download();
                }
            };

            const clearHistory = async () => {
                if (!isAdmin) {
                    alert("Unauthorized access restricted to verified admins.");
                    return;
                }
                
                if (!confirm("Are you sure you want to permanently delete all leads? This action cannot be undone.")) return;
                
                setIsLoading(true);
                try {
                    const snapshot = await getDocs(collection(db, "leads"));
                    const batch = snapshot.docs.map(d => deleteDoc(doc(db, "leads", d.id)));
                    await Promise.all(batch);
                    setHistory([]);
                    alert("Vault purged successfully.");
                } catch (err) {
                    console.error("Purge failed:", err);
                    alert("Failed to purge vault. Check permissions.");
                } finally {
                    setIsLoading(false);
                }
            };

            if (isInitialLoading) return html`<${Loader} />`;

            return html`
                <div className="min-h-screen p-4 sm:p-8 md:p-12 relative overflow-hidden flex flex-col justify-between">
                    <div className="max-w-6xl mx-auto space-y-10 relative z-10 w-full flex-1">
                        
                        <!-- Top Navigation Bar -->
                        <header className="no-print flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white/80 backdrop-blur-md p-4 sm:px-6 rounded-3xl border border-gray-100 shadow-sm">
                            <div className="cursor-pointer space-y-0.5" onClick=${() => setCurrentView(user ? 'dashboard' : 'landing')}>
                                <h1 className="text-2xl sm:text-3xl font-black text-gray-900 tracking-tighter flex items-center gap-1.5">
                                    <span>GBP Auditor</span>
                                    <span className="text-red-600">Pro</span>
                                </h1>
                                <p className="text-gray-400 font-bold uppercase tracking-[0.2em] text-[10px]">AI-Driven Local SEO Intelligence</p>
                            </div>

                            <!-- Flow View Switcher Links -->
                            <div className="flex flex-wrap items-center gap-2 sm:gap-4">
                                <button 
                                    onClick=${() => setCurrentView('landing')}
                                    className=${`px-3 py-1.5 rounded-xl text-xs font-black transition-all ${currentView === 'landing' ? 'bg-gray-900 text-white' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    Landing & Pricing
                                </button>

                                <button 
                                    onClick=${() => {
                                        if (user) {
                                            setCurrentView('dashboard');
                                        } else {
                                            login();
                                        }
                                    }}
                                    className=${`px-3 py-1.5 rounded-xl text-xs font-black transition-all ${currentView === 'dashboard' ? 'bg-red-600 text-white' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    Dashboard
                                </button>

                                ${isAdmin && html`
                                    <button 
                                        onClick=${() => setCurrentView('admin')}
                                        className=${`px-3 py-1.5 rounded-xl text-xs font-black flex items-center gap-1.5 transition-all ${currentView === 'admin' ? 'bg-red-700 text-white' : 'text-red-600 hover:bg-red-50'}`}
                                    >
                                        <${ShieldCheckIcon} size=${14} /> Admin Vault
                                    </button>
                                `}

                                <button 
                                    onClick=${() => setShowPricingModal(true)}
                                    className="px-3 py-1.5 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-700 hover:to-amber-700 text-white text-xs font-black rounded-xl flex items-center gap-1 shadow-sm transition-all active:scale-95"
                                    title="View Pricing Plans & Credit Packs"
                                >
                                    <${CrownIcon} size=${14} className="text-amber-200" />
                                    <span>Pricing</span>
                                </button>

                                ${user ? html`
                                    <div className="flex items-center gap-2 pl-2 border-l border-gray-200">
                                        <div className="hidden md:flex flex-col items-end">
                                            <span className="text-xs font-black text-gray-900 truncate max-w-[120px]">${user.displayName || user.email}</span>
                                            <button onClick=${logout} className="text-[10px] font-black text-red-600 uppercase tracking-widest hover:text-red-500">Sign Out</button>
                                        </div>
                                        <button 
                                            onClick=${logout}
                                            title="Sign Out"
                                            className="p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition-colors"
                                        >
                                            <${LogOutIcon} size=${16} />
                                        </button>
                                    </div>
                                ` : html`
                                    <button 
                                        onClick=${login}
                                        className="px-4 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-sm transition-all active:scale-95"
                                    >
                                        <${GoogleIcon} /> Sign In
                                    </button>
                                `}
                            </div>
                        </header>

                        <!-- Main Screen Render based on active flow -->
                        <main>
                            ${(currentView === 'admin' && isAdmin) ? html`
                                <${AdminPanel} 
                                    history=${history} 
                                    onClear=${clearHistory} 
                                    onClose=${() => setCurrentView('dashboard')} 
                                    onViewAudit=${viewAudit}
                                    adminEmail=${user?.email}
                                    paypalUrls=${paypalUrls}
                                    onSavePaypalUrls=${handleSavePaypalUrls}
                                    onLogout=${logout}
                                    onSetUserPlan=${handleSelectPlan}
                                    onAddTestCredits=${(amt) => handleAddCredits(amt, 'Test Credits')}
                                    currentPlan=${plan}
                                    creditsBalance=${credits}
                                    onGeneratePdf=${handleDirectPdfDownload}
                                />
                            ` : currentView === 'dashboard' ? html`
                                <${DashboardView} 
                                    user=${user}
                                    plan=${plan}
                                    credits=${credits}
                                    history=${history.filter(h => h.userId === user?.uid)}
                                    auditsThisCycle=${auditsThisCycle}
                                    cycleDaysLeft=${cycleDaysLeft}
                                    cycleEndDate=${cycleEndDate}
                                    onRunAudit=${runAudit}
                                    isLoading=${isLoading}
                                    result=${result}
                                    onResetResult=${() => { setResult(null); setActiveBusinessDetails(null); }}
                                    activeBusiness=${activeBusiness}
                                    activeBusinessDetails=${activeBusinessDetails}
                                    onOpenPricing=${() => setShowPricingModal(true)}
                                    onViewAudit=${viewAudit}
                                    onGeneratePdf=${handleDirectPdfDownload}
                                    isAdmin=${isAdmin}
                                    paypalUrls=${paypalUrls}
                                    onGoToLanding=${() => setCurrentView('landing')}
                                />
                            ` : html`
                                <${LandingPage} 
                                    onStartAudit=${() => {
                                        if (user) {
                                            setCurrentView('dashboard');
                                        } else {
                                            login();
                                        }
                                    }}
                                    onLogin=${login}
                                    user=${user}
                                    onGoToDashboard=${() => setCurrentView('dashboard')}
                                    onOpenPricing=${() => setShowPricingModal(true)}
                                    paypalUrls=${paypalUrls}
                                    isAdmin=${isAdmin}
                                    onOpenAdmin=${() => setCurrentView('admin')}
                                />
                            `}
                        </main>

                        <!-- Pricing & Credits Modal -->
                        <${PricingAndCreditsModal}
                            isOpen=${showPricingModal}
                            onClose=${() => setShowPricingModal(false)}
                            currentPlan=${plan}
                            creditsBalance=${credits}
                            auditsThisMonth=${auditsThisCycle}
                            auditsThisYear=${history.length}
                            onSelectPlan=${handleSelectPlan}
                            onAddCredits=${handleAddCredits}
                            paypalUrls=${paypalUrls}
                            isAdmin=${isAdmin}
                        />

                        <!-- PDF Preview Modal -->
                        <${PdfPreviewModal}
                            isOpen=${Boolean(previewPdfData)}
                            onClose=${() => setPreviewPdfData(null)}
                            pdfData=${previewPdfData}
                            onDownload=${() => previewPdfData?.download()}
                        />
                    </div>

                    <!-- Footer -->
                    <footer className="no-print pt-16 border-t border-gray-100 flex flex-col md:flex-row justify-between items-center gap-6 text-gray-500 font-bold text-sm max-w-6xl mx-auto w-full z-10 relative">
                        <div className="flex flex-wrap items-center justify-center md:justify-start gap-2 text-center md:text-left">
                            <span>2026 Marketing Management Enterprise LLC</span>
                            <span className="text-gray-300">|</span>
                            <span>Google Business Profile Auditor</span>
                            <span className="text-gray-300">|</span>
                            <span className="text-gray-600 font-semibold">Gemini Precision Local Intelligence</span>
                        </div>
                        <div className="flex gap-8 text-xs uppercase tracking-widest text-gray-400">
                            <a href="javascript:void(0)" onClick=${() => setCurrentView('landing')} className="hover:text-gray-900 transition-colors">Home</a>
                            <a href="#pricing" onClick=${() => { setCurrentView('landing'); }} className="hover:text-gray-900 transition-colors">Pricing</a>
                            <a href="#reviews" onClick=${() => { setCurrentView('landing'); }} className="hover:text-gray-900 transition-colors">Reviews</a>
                        </div>
                    </footer>

                    <div className="fixed top-0 left-0 w-full h-full pointer-events-none -z-0">
                        <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-red-50 rounded-full blur-[120px] opacity-60"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-50 rounded-full blur-[120px] opacity-60"></div>
                    </div>
                </div>
            `;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    })();
    </script>
</body>
</html>
