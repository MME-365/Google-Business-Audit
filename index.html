    <script>
        // Infrastructure Shield: Suppress noise from browser extensions (MetaMask, Wallet, etc.)
        (function() {
            const isExtensionNoise = (msg) => {
                if (!msg || typeof msg !== 'string') return false;
                const low = msg.toLowerCase();
                return low.includes('metamask') || low.includes('ethereum') || 
                       low.includes('web3') || low.includes('wallet') ||
                       (low.includes('failed to connect') && low.includes('extension'));
            };

            // Global Error Shield
            window.onerror = function(msg, url, line, col, error) {
                if (isExtensionNoise(msg)) return true;
                console.error('Core Error:', msg, { url, line, col, error });
                return false;
            };
            window.onunhandledrejection = function(e) {
                const msg = e.reason && (e.reason.message || e.reason);
                if (isExtensionNoise(msg)) { e.preventDefault(); return true; }
            };

            // Console Shield
            ['error', 'warn', 'info'].forEach(m => {
                const orig = console[m];
                console[m] = (...args) => {
                    const combined = args.map(a => {
                        try { return typeof a === 'string' ? a : JSON.stringify(a); } catch (e) { return String(a); }
                    }).join(' ');
                    if (isExtensionNoise(combined)) return;
                    orig.apply(console, args);
                };
            });

            // Mock Provider to preempt extension injection and stop connection errors
            if (!window.ethereum) {
                const silent = { request: () => Promise.resolve([]), on: () => {}, removeListener: () => {}, isMetaMask: false };
                try {
                    Object.defineProperty(window, 'ethereum', { value: silent, writable: false, configurable: false });
                } catch (e) { window.ethereum = silent; }
            }
        })();
    </script>

                            cx=${radius}

                    </div>
                    <button onClick=${onClose} className="p-3 hover:bg-gray-100 rounded-2xl transition-colors">
                        <${XIcon} size=${28} />
                    </button>
                </div>

                ${history.length === 0 ? html`
                    <div className="py-20 text-center space-y-4">
                        <div className="inline-block p-6 bg-gray-50 rounded-[40px] text-gray-300">
                             <${SearchIcon} size=${64} />
                        </div>
                        <p className="text-gray-400 font-bold text-xl">No scan history found.</p>
                    </div>
                ` : html`
                    <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest">Company</th>
                                    <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest">Score</th>
                                    <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest">Contact</th>
                                    <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest">Market</th>
                                    <th className="px-6 py-4 font-black text-gray-500 text-xs uppercase tracking-widest whitespace-nowrap">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-50">
                                ${history.map((entry, idx) => html`
                                    <tr key=${idx} className="hover:bg-gray-50/50 transition-colors">
                                        <td className="px-6 py-6 font-bold text-gray-900">
                                            <div className="flex flex-col">
                                                <span>${entry.businessName}</span>
                                                <span className="text-xs text-indigo-500 font-medium">${entry.website || 'No Website'}</span>
                                            </div>
                                        </td>
                                        <td className="px-6 py-6 font-black">
                                            <span className=${`px-3 py-1 rounded-full text-sm ${entry.overallScore < 40 ? 'bg-red-50 text-red-600' : entry.overallScore < 75 ? 'bg-amber-50 text-amber-600' : 'bg-emerald-50 text-emerald-600'}`}>
                                                ${entry.overallScore}
                                            </span>
                                        </td>
                                        <td className="px-6 py-6 text-gray-600">
                                            <div className="flex flex-col">
                                                <span className="font-bold whitespace-nowrap">${entry.email}</span>
                                                <span className="text-xs">${entry.phoneNumber}</span>
                                            </div>
                                        </td>
                                        <td className="px-6 py-6 text-gray-500">${entry.location}</td>
                                        <td className="px-6 py-6">
                                            <button 
                                                onClick=${() => onViewAudit(entry)}
                                                className="text-red-600 font-black hover:underline whitespace-nowrap flex items-center gap-1"
                                            >
                                                View <${ExternalLinkIcon} size=${14} />
                                            </button>
                                        </td>
                                    </tr>
                                `)}
                            </tbody>
                        </table>
                    </div>
                    <div className="mt-12 flex justify-end">
                        <button 
                            onClick=${onClear}
                            className="bg-red-50 text-red-600 px-6 py-3 rounded-2xl font-black hover:bg-red-100 transition-colors flex items-center gap-2"
                        >
                            <${TrashIcon} size=${18} /> Purge Vault
                        </button>
                    </div>
                `}
            </div>
        `;

        // --- MAIN APP ---

        const App = () => {
            const [user, setUser] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [isInitialLoading, setIsInitialLoading] = useState(true);
            const [result, setResult] = useState(null);
            const [selectedLead, setSelectedLead] = useState(null);
            const [error, setError] = useState(null);
            const [activeBusiness, setActiveBusiness] = useState('');
            const [history, setHistory] = useState([]);
            const [showAdmin, setShowAdmin] = useState(false);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setIsInitialLoading(false);
                });
                return unsubscribe;
            }, []);

            const login = async () => {
                const provider = new GoogleAuthProvider();
                try {
                    await signInWithPopup(auth, provider);
                } catch (err) {
                    console.error("Login failed", err);
                }
            };

            const logout = () => signOut(auth);

            const adminEmail = "customerservice.mme365@gmail.com"; // Set the authorized admin email

            useEffect(() => {
                if (!user) return;
                
                const fetchHistory = async () => {
                    try {
                        let q;
                        if (user.email === adminEmail) {
                            // Admin sees all leads
                            q = query(
                                collection(db, "leads"), 
                                orderBy("timestamp", "desc")
                            );
                        } else {
                            // Regular users see only their own
                            q = query(
                                collection(db, "leads"), 
                                where("userId", "==", user.uid),
                                orderBy("timestamp", "desc")
                            );
                        }
                        const snapshot = await getDocs(q);
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setHistory(data);
                    } catch (err) {
                        console.error("Failed to fetch history:", err);
                    }
                };
                fetchHistory();
            }, [user]);

            const runAudit = async (data) => {
                if (!user) return;
                setIsLoading(true);
                setError(null);
                setResult(null);
                setActiveBusiness(data.businessName);

                try {
                    const response = await fetch(`${API_BASE}/api/audit`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            businessName: data.businessName,
                            location: data.location,
                            phoneNumber: data.phoneNumber
                        })
                    });

                    if (!response.ok) throw new Error("Audit generation failed");
                    const auditResult = await response.json();

                    // Save lead to Firestore
                    const leadData = {
                        ...data,
                        userId: user.uid,
                        overallScore: auditResult.overallScore,
                        auditBreakdown: auditResult.auditBreakdown,
                        recommendations: auditResult.recommendations,
                        timestamp: new Date().toISOString(),
                        serverTimestamp: serverTimestamp()
                    };
                    
                    await addDoc(collection(db, "leads"), leadData);

                    setResult(auditResult);
                    
                    // Refresh history locally
                    setHistory(prev => [leadData, ...prev]);

                } catch (err) {
                    console.error("Audit failed:", err);
                    setError("Failed to process audit. Check console.");
                } finally {
                    setIsLoading(false);
                }
            };

            const viewAudit = (lead) => {
                if (lead.auditBreakdown && lead.recommendations) {
                    setResult({
                        overallScore: lead.overallScore,
                        auditBreakdown: lead.auditBreakdown,
                        recommendations: lead.recommendations
                    });
                    setActiveBusiness(lead.businessName);
                    setShowAdmin(false);
                } else {
                    // Fallback for older leads or if generation is needed
                    setResult({
                        overallScore: lead.overallScore,
                        auditBreakdown: [
                            { category: 'Historical Data', score: lead.overallScore, comment: 'This is an archived lead. Precision breakdown available in modern scans only.' }
                        ],
                        recommendations: [
                            { title: 'Data Migration', description: 'Contact your technical lead to migrate legacy reports to the new persistent format.' }
                        ]
                    });
                    setActiveBusiness(lead.businessName);
                    setShowAdmin(false);
                }
            };

            const clearHistory = async () => {
                if (user?.email !== adminEmail) {
                    alert("Unauthorized access restricted.");
                    return;
                }
                
                if (!confirm("Are you sure you want to permanently delete all leads? This action cannot be undone.")) return;
                
                setIsLoading(true);
                try {
                    const snapshot = await getDocs(collection(db, "leads"));
                    const batch = snapshot.docs.map(d => deleteDoc(doc(db, "leads", d.id)));
                    await Promise.all(batch);
                    setHistory([]);
                    alert("Vault purged successfully.");
                } catch (err) {
                    console.error("Purge failed:", err);
                    alert("Failed to purge vault. Check permissions.");
                } finally {
                    setIsLoading(false);
                }
            };

            if (isInitialLoading) return html`<${Loader} />`;

            return html`
                <div className="min-h-screen p-4 sm:p-8 md:p-12 relative overflow-hidden">
                    <div className="max-w-6xl mx-auto space-y-12 relative z-10">
                        
                        <header className="no-print flex justify-between items-start">
                            <div className="space-y-1">
                                <h1 className="text-4xl font-black text-gray-900 tracking-tighter">GBP Auditor <span className="text-red-600">Pro</span></h1>
                                <p className="text-gray-400 font-bold uppercase tracking-[0.2em] text-xs">AI-Driven Local SEO Intelligence</p>
                            </div>
                            <div className="flex items-center gap-4">
                                ${user && html`
                                    <div className="hidden md:flex flex-col items-end mr-2">
                                        <span className="text-sm font-black text-gray-900">${user.displayName}</span>
                                        <button onClick=${logout} className="text-[10px] font-black text-red-600 uppercase tracking-widest hover:text-red-500">Sign Out</button>
                                    </div>
                                `}
                                <button 
                                    onClick=${() => setShowAdmin(!showAdmin)}
                                    className="p-3 bg-white border border-gray-100 rounded-2xl shadow-sm text-gray-400 hover:text-red-600 transition-colors"
                                >
                                    <${SettingsIcon} size=${24} />
                                </button>
                            </div>
                        </header>

                        <main>
                            ${!user ? html`
                                <${LoginView} onLogin=${login} />
                            ` : showAdmin ? html`
                                <${AdminPanel} history=${history} onClear=${clearHistory} onClose=${() => setShowAdmin(false)} onViewAudit=${viewAudit} />
                            ` : isLoading ? html`
                                <${Loader} />
                            ` : result ? html`
                                <${AuditResultView} result=${result} businessName=${activeBusiness} onReset=${() => setResult(null)} />
                            ` : html`
                                <div className="space-y-20">
                                    <div className="text-center space-y-6 pt-10">
                                        <h2 className="text-5xl md:text-7xl font-black text-gray-900 leading-none tracking-tight">Are you losing <br/><span className="text-red-600">Local Customers?</span></h2>
                                        <p className="text-xl text-gray-500 max-w-2xl mx-auto leading-relaxed">
                                            Most Google Business Profiles are only 40% optimized. Get an instant multi-signal audit to discover how to dominate your local market.
                                        </p>
                                    </div>
                                    <${BusinessInputForm} onSubmit=${runAudit} isLoading=${isLoading} />
                                </div>
                            `}
                        </main>

                        <footer className="no-print pt-20 border-t border-gray-100 flex flex-col md:flex-row justify-between items-center gap-6 text-gray-400 font-bold text-sm">
                            <div className="flex items-center gap-2">
                                &copy; ${new Date().getFullYear()} SEO Services Inc. <span className="text-gray-200">|</span> Precision Intelligence
                            </div>
                            <div className="flex gap-8">
                                <a href="javascript:void(0)" className="hover:text-gray-900 transition-colors">Privacy</a>
                                <a href="javascript:void(0)" className="hover:text-gray-900 transition-colors">Terms</a>
                                <a href="javascript:void(0)" className="hover:text-gray-900 transition-colors">Contact</a>
                            </div>
                        </footer>
                    </div>

                    <div className="fixed top-0 left-0 w-full h-full pointer-events-none -z-0">
                        <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-red-50 rounded-full blur-[120px] opacity-60"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-emerald-50 rounded-full blur-[120px] opacity-60"></div>
                    </div>
                </div>
            `;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    })();
    </script>
</body>
</html>
